# Port-binding policy
# -------------------
# Only two services are meant to be reachable from outside the host: `app`
# (the UI/API) and `ingest` (the agent's TCP channel). Everything else binds
# to ${BIND_ADDR}, which defaults to 127.0.0.1 — reachable for local debugging
# and `docker exec`, not from the LAN.
#
# This matters because most of these services have no authentication at all in
# the default configuration: OpenSearch runs with DISABLE_SECURITY_PLUGIN, and
# OpenSearch Dashboards is an unauthenticated window onto every log the
# platform has collected. Publishing them on 0.0.0.0 hands over the fleet's
# telemetry to anyone who can route to the box.
#
# To expose one deliberately, put it behind the same reverse proxy and auth as
# `app` rather than setting BIND_ADDR=0.0.0.0.

services:
  db:
    image: mysql:8.0
    container_name: sentora-db
    restart: always
    # no-new-privileges is applied only to the images built from this repo.
    # The upstream mysql / opensearch / rabbitmq entrypoints drop privileges
    # during startup, and hardening those is not worth an untested boot
    # failure — they are unreachable from outside the host either way.
    command: [ "--max_connections=500", "--wait_timeout=120", "--interactive_timeout=120" ]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3307:3306"
    volumes:
      # Only init_userdb.sql belongs here. It creates and selects `userdb`.
      #
      # db/init.sql used to be mounted beside it and it is not a server-init
      # script at all - it is the per-agent schema template, applied by
      # server.create_tables_if_not_exist() *after* connecting to that agent's
      # own database, which is why it contains no CREATE DATABASE or USE.
      #
      # Each file in this directory runs in its own mysql session, so the
      # `USE userdb` at the end of the first one does not carry over. On a
      # first boot the second file therefore failed at line 5 with "No
      # database selected", MySQL aborted initialisation, and the container
      # came up unhealthy. Nobody hit it because the volume already existed on
      # every machine that had ever run this - it only breaks for someone
      # setting the project up for the first time.
      - ./db/init_userdb.sql:/docker-entrypoint-initdb.d/1-init_userdb.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Expanded by the shell *inside* the db container, so it has to name a
      # variable that exists there. It previously read $${DB_PASSWORD}, which
      # is only set on the host — it fell through to the literal default and
      # so only ever matched when DB_PASSWORD was left at that default.
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\"" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    container_name: sentora-ollama
    restart: always
    ports:
      - "${BIND_ADDR:-127.0.0.1}:11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 8G

  ollama-init:
    image: ollama/ollama:latest
    container_name: sentora-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: [ "/bin/sh" ]
    command:
      - "-c"
      - "echo '[ollama-init] pulling ${OLLAMA_MODEL:-llama3.2:3b}...' && ollama pull ${OLLAMA_MODEL:-llama3.2:3b} && echo '[ollama-init] verifying...' && ollama list && ollama list | grep -F '${OLLAMA_MODEL:-llama3.2:3b}' && echo '[ollama-init] done.'"

  app:
    build: .
    container_name: sentora-server
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/api
      OLLAMA_MODEL: llama3.2:3b
      WORKERS: 1
      # core/mq.py falls back to guest:guest when this is unset, which would
      # silently break publishing the moment the broker credentials change.
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sentora}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}@rabbitmq/
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      # The agent Fernet key lives here (data/fernet.key). Without a volume it
      # was regenerated on every `docker compose down && up`, which silently
      # made all previously encrypted agent telemetry unreadable. Back this
      # volume up — there is no key rotation path.
      - sentora_data:/app/data
    # The whole host filesystem used to be bind-mounted here as
    # `/:/host_disk:ro`, so that the dashboard could show one disk-usage
    # percentage. That handed /etc/shadow, every SSH key and every other
    # container's volume to anything that achieved code execution in this
    # container. `_server_disk_percent()` falls back to the container's own
    # filesystem when /host_disk is absent, so the gauge still works — it now
    # reports the container's view rather than the host's.
    #
    # If you need the host figure, mount something narrow that lives on the
    # host root filesystem; statvfs reports the whole filesystem's stats from
    # any path on it, so no directory contents need to be exposed:
    #   volumes:
    #     - /etc/hostname:/host_disk:ro

  ingest:
    build: .
    container_name: sentora-ingest
    restart: always
    security_opt:
      - no-new-privileges:true
    command: [ "python", "server.py" ]
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/api
      OLLAMA_MODEL: llama3.2:3b
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sentora}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}@rabbitmq/
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "5001:5001"
    volumes:
      # Read-only, and required. The agent encrypts `message` before sending;
      # this key is what turns it back into a log. Without it the worker
      # serialises `enc::gAAAA...` into the prompt and the model answers
      # anyway - which is how ciphertext went to the model unnoticed.
      #
      # `app` owns the volume and creates the key on first boot. Mounting it
      # read-only here means a container that starts before that cannot
      # quietly generate a different one and decrypt nothing.
      - sentora_data:/app/data:ro

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sentora-rabbitmq
    restart: always
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5672:5672"
      - "${BIND_ADDR:-127.0.0.1}:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sentora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}

  ai-worker-automation:
    build: .
    container_name: sentora-ai-worker-automation
    restart: always
    security_opt:
      - no-new-privileges:true
    command: [ "python", "ai_worker.py" ]
    env_file:
      - .env
    environment:
      - WORKER_TYPE=automation
      - OLLAMA_BASE_URL=http://ollama:11434/api
      - OLLAMA_MODEL=llama3.2:3b
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-sentora}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}@rabbitmq/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

    volumes:
      # Read-only, and required. The agent encrypts `message` before sending;
      # this key is what turns it back into a log. Without it the worker
      # serialises `enc::gAAAA...` into the prompt and the model answers
      # anyway - which is how ciphertext went to the model unnoticed.
      #
      # `app` owns the volume and creates the key on first boot. Mounting it
      # read-only here means a container that starts before that cannot
      # quietly generate a different one and decrypt nothing.
      - sentora_data:/app/data:ro

  ai-worker-manual:
    build: .
    container_name: sentora-ai-worker-manual
    restart: always
    security_opt:
      - no-new-privileges:true
    command: [ "python", "ai_worker.py" ]
    env_file:
      - .env
    environment:
      - WORKER_TYPE=manual
      - OLLAMA_BASE_URL=http://ollama:11434/api
      - OLLAMA_MODEL=llama3.2:3b
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-sentora}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}@rabbitmq/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

    volumes:
      # Read-only, and required. The agent encrypts `message` before sending;
      # this key is what turns it back into a log. Without it the worker
      # serialises `enc::gAAAA...` into the prompt and the model answers
      # anyway - which is how ciphertext went to the model unnoticed.
      #
      # `app` owns the volume and creates the key on first boot. Mounting it
      # read-only here means a container that starts before that cannot
      # quietly generate a different one and decrypt nothing.
      - sentora_data:/app/data:ro

  ai-worker-defensive:
    build: .
    container_name: sentora-ai-worker-defensive
    restart: always
    security_opt:
      - no-new-privileges:true
    command: [ "python", "ai_worker.py" ]
    env_file:
      - .env
    environment:
      - WORKER_TYPE=defensive
      - OLLAMA_BASE_URL=http://ollama:11434/api
      - OLLAMA_MODEL=llama3.2:3b
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-sentora}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}@rabbitmq/
      # AI_SHADOW_MODE=1 makes the defensive worker stage proposals
      # ('AI_DEFENSIVE_SHADOW' with shadow_status='pending') instead of
      # dispatching real SOAR actions. Operator approves/rejects from the
      # SOAR Hub → Shadow Queue tab. Leave unset for normal autonomy.
      - AI_SHADOW_MODE=${AI_SHADOW_MODE:-0}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

    volumes:
      # Read-only, and required. The agent encrypts `message` before sending;
      # this key is what turns it back into a log. Without it the worker
      # serialises `enc::gAAAA...` into the prompt and the model answers
      # anyway - which is how ciphertext went to the model unnoticed.
      #
      # `app` owns the volume and creates the key on first boot. Mounting it
      # read-only here means a container that starts before that cannot
      # quietly generate a different one and decrypt nothing.
      - sentora_data:/app/data:ro

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: sentora-opensearch
    restart: always
    environment:
      - cluster.name=sentora-cluster
      - node.name=sentora-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      # No authentication on the cluster. Acceptable only because the port is
      # bound to BIND_ADDR and nothing outside the compose network reaches it.
      # Enabling the security plugin means issuing node/client certs and
      # teaching core/opensearch.py to present them — worth doing before this
      # is ever exposed beyond the host.
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9200:9200"
      - "${BIND_ADDR:-127.0.0.1}:9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.12.0
    container_name: sentora-dashboards
    restart: always
    ports:
      # Unauthenticated read access to every collected log. The "Open
      # Dashboards" button in Log Explorer links to port 5601 on the server's
      # hostname, so that button only works from the host itself unless you
      # deliberately publish this — which should be through an authenticating
      # reverse proxy, not by widening BIND_ADDR.
      - "${BIND_ADDR:-127.0.0.1}:5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    depends_on:
      - opensearch

volumes:
  mysql_data:
  opensearch_data:
  sentora_data:
