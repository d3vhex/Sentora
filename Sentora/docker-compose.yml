services:
  db:
    image: postgres:15
    container_name: sentora-db-agent
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentora
      POSTGRES_USER: sentorauser
      POSTGRES_PASSWORD: sentorapass
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
volumes:
  db_data:
